name: CI with Caching

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: cache-49a777d-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            cache-49a777d-${{ runner.os }}-

      - name: prime-cache-49a777d
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" == "true" ]; then
            echo "Cache hit! Dependencies were restored from cache."
          else
            echo "Cache miss! Dependencies will be installed and cached."
          fi
          echo "Cache hit status: ${{ steps.cache.outputs.cache-hit }}"

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          npm init -y
          npm install express

      - name: Display completion
        run: echo "Workflow with caching completed successfully!"
